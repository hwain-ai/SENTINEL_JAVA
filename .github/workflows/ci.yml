# Java 검사기 자체 시험을 지원 플랫폼 전부에서 돌린다. sentinel-tool/setup.sh(scripts/toolchain.py setup)가 잠금 파일의
# 해당 플랫폼 항목으로 JDK·Maven·변이 백엔드·오프라인 Maven 저장소·컴파일을 준비하고, 같은 실행기로 시험을 돌린다.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify the tool adapter response contract
        run: python3 -I -B sentinel-tool/test_adapter.py
      - name: Restore the sealed toolchain
        uses: actions/cache@v4
        with:
          # The self-check attempt folders are run output, not toolchain.
          path: |
            .toolchain
            !.toolchain/self-crap-runs
            !.toolchain/self-mutation-runs
          key: java-toolchain-${{ matrix.os }}-${{ hashFiles('toolchain.lock.json', 'backend.lock.json', 'pom.xml', 'src/main/resources/pit-probe-artifacts.tsv') }}
      - name: Bootstrap the JDK, Maven, mutation backend, offline repository and PIT probe inputs
        run: |
          sentinel-tool/setup.sh
          scripts/bootstrap-pit-probe.sh
      - name: Run the checker's tests offline under its own CRAP gate
        run: python3 -I -B scripts/toolchain.py self-crap
      - name: Prove the checker's own mutation slice
        run: python3 -I -B scripts/toolchain.py self-mutation-slice
